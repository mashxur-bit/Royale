  if(!Array.isArray(a))continue;const k=ORDER[a[0]|0];if(!k||!CARDS[k].spell)continue;
  const x=360-clampN(a[2],0,360),y=520-clampN(a[3],0,520),tm=a[1]?'e':'p',key=k+tm+x+'_'+y;
  let s=S.sp.find(q=>q.key===key);if(!s){s={key,team:tm,x,y,k,t:0,d:CARDS[k].dur||.9}}
  s.t=Math.max(s.t,clampN(a[4],0,5));keep.push(s);
 }
 S.sp=keep;
 for(const a of(Array.isArray(sn.bl)?sn.bl:[]).slice(0,8)){if(!Array.isArray(a))continue;const k=ORDER[a[3]|0];if(!k)continue;S.fx.push({circ:1,x:360-clampN(a[0],0,360),y:520-clampN(a[1],0,520),t:.5,t0:.5,rd:clampN(a[2],10,120),col:k==='zap'?0x9fd8ff:k==='arrows'?0xd8d0b8:0xff7a1a})}
 for(const a of(Array.isArray(sn.bm)?sn.bm:[]).slice(0,12)){if(!Array.isArray(a))continue;const ci=a[4]|0;S.fx.push({x1:360-clampN(a[0],0,360),y1:520-clampN(a[1],0,520),x2:360-clampN(a[2],0,360),y2:520-clampN(a[3],0,520),t:.12,c:ci===0?'#ff6a5a':ci===1?'#ffffff':'#ffd24a'})}
}
function guestStep(dt){
 S.t=Math.max(0,S.t-dt);S.el.p=Math.min(10,S.el.p+dt/2.8);S.el.e=Math.min(10,S.el.e+dt/2.8);
 const now=performance.now();
 for(const u of S.units){const k=Math.min(1,(now-u.tt)/110);u.x=u.x0+(u.tx-u.x0)*k;u.y=u.y0+(u.ty-u.y0)*k}
 for(const s of S.sp)s.t+=dt;
 S.sp=S.sp.filter(s=>s.t<s.d+.4);
 for(const f of S.fx)f.t-=dt;S.fx=S.fx.filter(f=>f.t>0);
 if(OL.last&&now-OL.last>6000)olLost('Связь потеряна');
}
function olEnd2(m){
 if(m.isMe||OL.role!=='guest'||!S||S.on!=='guest'||S.over)return;
 const d=m.data;if(!d||!Array.isArray(d.cr))return;
 S.cr.p=clampN(d.cr[1],0,3);S.cr.e=clampN(d.cr[0],0,3);end();
}
function badge(code){
 const b=$('codeb');
 if(!code){b.style.display='none';return}
 b.innerHTML='🌐 Код комнаты<b>'+code.toUpperCase()+'</b><small>Друг: открой эту же ссылку или «Онлайн-бой → Войти»</small>';b.style.display='block';
}
$('codeb').onclick=()=>{try{navigator.clipboard.writeText((OL.code||'').toUpperCase()).then(()=>toast('Код скопирован'),()=>{})}catch(e){}};
async function autoStart(){
 if(!window.OK3D||DECK.length!==8)return;
 const h=(location.hash||'').slice(1).toLowerCase(),code=/^[a-z0-9]{4}$/.test(h)?h:newCode();
 newGame();show('Bt');
 const room=await olRoom();
 if(!room){toast('Онлайн недоступен: играй против бота');return}
 if(await olJoin(code,'auto')){try{location.hash=code}catch(e){}badge(code)}
}
setTimeout(()=>{if(!window.OK3D){$('err').textContent='Не удалось запустить 3D.\n'+(window.__errs||[]).join('\n')+'\n\nОбнови страницу. Если не помогло, пришли скриншот этого текста.';$('err').style.display='block'}},4000);
$('olB').onclick=olOpen;$('olQ').onclick=olQuick;$('olC').onclick=olCreate;$('olJ').onclick=olEnter;
$('olX').onclick=()=>{olClean();$('ol').style.display='none'};
if(/^#[a-z0-9]{4}$/i.test(location.hash||''))autoStart();
</script>
